<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 凸透鏡成像模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f7;--bg2:#dbe3f6;--glass:rgba(255,255,255,.74);--bd:rgba(20,30,70,.10);--tx:#0f172a;--mut:#64748b;--acc:#4f46e5;--acc2:#06b6d4;--track:rgba(15,23,42,.14);--dot:rgba(15,23,42,.10);--sh:0 10px 34px rgba(30,41,90,.14);--thumb:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070a12;--bg2:#141d38;--glass:rgba(20,26,44,.64);--bd:rgba(255,255,255,.09);--tx:#e8ecf6;--mut:#8a94ad;--acc:#7c8cff;--acc2:#22d3ee;--track:rgba(255,255,255,.16);--dot:rgba(255,255,255,.07);--sh:0 12px 44px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070a12;--bg2:#141d38;--glass:rgba(20,26,44,.64);--bd:rgba(255,255,255,.09);--tx:#e8ecf6;--mut:#8a94ad;--acc:#7c8cff;--acc2:#22d3ee;--track:rgba(255,255,255,.16);--dot:rgba(255,255,255,.07);--sh:0 12px 44px rgba(0,0,0,.55);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.45 Inter,system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}
#app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;grid-template-rows:1fr 0px;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
#app.open{grid-template-rows:1fr var(--dh,26%)}
#vp{position:relative;min-height:0;overflow:hidden;background:radial-gradient(900px 500px at 15% -10%,var(--bg2),transparent 70%),radial-gradient(var(--dot) 1px,transparent 1px) 0 0/24px 24px,var(--bg);-webkit-tap-highlight-color:transparent;}
#vp canvas.m{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--sh)}
#pvbox{position:absolute;left:14px;top:14px;width:min(34%,190px);border-radius:16px;overflow:hidden;pointer-events:none;background:#0b0b10;border:1px solid var(--bd);box-shadow:var(--sh)}
#pvw{position:relative;width:100%;aspect-ratio:1;overflow:hidden}#pv{width:100%;height:100%;display:block;transform:scale(1.08);background:linear-gradient(#9db8e6,#e9f0fb)}#pvmsg{display:none;position:absolute;inset:0;place-items:center;color:#cfd5e6;font-size:12px}
#pvt{color:#cfd5e6;font-size:10px;padding:5px 8px;background:rgba(0,0,0,.55);letter-spacing:.02em}
#auto{position:absolute;right:14px;top:14px;border:0;border-radius:999px;padding:11px 18px;font:600 13px Inter,system-ui,sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .15s}
#auto:active{transform:scale(.96)}
#omenu{position:absolute;left:14px;top:14px;display:none;gap:4px;padding:5px;border-radius:999px}#omenu.on{display:flex}
#omenu button{border:0;background:transparent;color:var(--mut);padding:7px 12px;border-radius:999px;font:500 12px Inter,system-ui,sans-serif;cursor:pointer}
#omenu button.act{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
#toast{position:absolute;right:14px;top:62px;max-width:min(68%,340px);padding:10px 14px;border-radius:14px;font-size:12px;opacity:0;transform:translateY(-6px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#tl{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 180px);z-index:3;pointer-events:none}#tl>*{pointer-events:auto}#tl #hud{position:static;max-width:none}#ur{display:flex;gap:8px}#ur .rb{width:36px;height:36px}#ur .rb svg{width:18px;height:18px}.rb:disabled{opacity:.35;pointer-events:none}#app.play #tl{display:none!important}
#hud{position:absolute;left:14px;top:14px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 180px)}
.chip{padding:5px 11px;border-radius:999px;font-size:11px;color:var(--mut)}
.chip b{color:var(--tx);font-weight:600;margin-left:4px}.chip b.ok{color:#22c55e}.chip b.bad{color:#f43f5e}
#tools{position:absolute;right:14px;bottom:14px;display:flex;gap:8px}
.rb svg,.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb svg{width:20px;height:20px}.ic{width:18px;height:18px}
#auto{display:flex;align-items:center;gap:7px}.btn .ic{width:15px;height:15px;display:block}
.opts button{display:flex;flex-direction:column;align-items:center;gap:7px}.opts .ic{width:24px;height:24px}
.rb.act{outline:2px solid var(--acc);color:var(--acc)}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--tx);cursor:pointer;padding:0}
#set{position:absolute;right:14px;bottom:64px;width:min(330px,calc(100% - 28px));border-radius:18px;padding:14px;display:none;grid-template-columns:1fr 1fr;gap:10px;max-height:72%;overflow:auto}
#set.on{display:grid}
#set h4{grid-column:1/-1;margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#set label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}
#set .presets{grid-column:1/-1;display:flex;gap:6px}#set .presets .btn{grid-column:auto;border-radius:999px;flex:1}.btn.act{background:var(--acc);color:#fff;border-color:var(--acc)}
#set .gs{grid-column:1/-1}#set .gs label{flex-direction:row;justify-content:space-between}#set .gs b{color:var(--tx);font-weight:600}
#set input:not([type=range]):not([type=checkbox]){width:100%;padding:7px 9px;border-radius:9px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:500 13px Inter,sans-serif}
.btn{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:999px;padding:6px 12px;font:500 12px Inter,sans-serif;cursor:pointer}
.btn.danger{color:#f43f5e}
#set .btn{grid-column:1/-1;border-radius:10px}
#dash{min-height:0;overflow:hidden}
#dashin{height:100%;overflow:auto;padding:12px 18px;border-radius:22px 22px 0 0;border-bottom:0}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.dh strong{font-size:14px;font-weight:600}.sp{flex:1}
#dims{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dl{position:absolute;transform:translate(-50%,-50%);padding:3px 9px;border-radius:999px;font:600 11px Inter,system-ui,sans-serif;color:var(--tx);white-space:nowrap}
#dobj{display:none;flex-direction:column;gap:6px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opts button{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:14px;padding:14px 6px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.opts button.act{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.sl label{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:11px;margin-bottom:6px}
.num{width:64px;background:transparent;border:0;border-bottom:1px solid var(--bd);color:var(--tx);text-align:right;font:600 13px Inter,sans-serif;padding:0 2px}
.num:focus{outline:0;border-color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;margin:6px 0;outline:0;background:linear-gradient(90deg,var(--acc),var(--acc2)) 0/var(--p,50%) 100% no-repeat,var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--thumb);border:2px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--thumb);border:2px solid var(--acc)}

#lockb{position:absolute;right:14px;bottom:62px;display:none}
#app.pm #lockb{display:grid}
#app.pm #set{bottom:110px;max-height:calc(100% - 170px)}
#pmb{display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600}
#dslides{display:none;flex-direction:column;gap:8px;height:100%}
#dslides .dh{flex-wrap:wrap;row-gap:4px;margin-bottom:0}
.tm{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:11px}.tm .num{width:38px}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
#pplay{display:flex;align-items:center;gap:6px}
#strip{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;flex:1;min-height:92px;padding:3px 3px 6px}
.sd{position:relative;flex:0 0 auto;align-self:stretch;min-height:0;aspect-ratio:16/9;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--bg2);cursor:pointer}
.sd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.sd img:not([src]){visibility:hidden}
.sd.cur{outline:2px solid var(--acc);outline-offset:1px}
.sd .sn{position:absolute;left:6px;top:5px;background:rgba(0,0,0,.55);color:#fff;font:600 10px Inter,sans-serif;padding:1px 7px;border-radius:999px}
.sd .sm{position:absolute;right:5px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;padding:0;display:none;place-items:center}.sd .sm svg{width:14px;height:14px;fill:#fff}
.sd.cur .sm,.sd:hover .sm{display:grid}
.sd .slk{position:absolute;right:6px;bottom:5px;display:grid;background:rgba(0,0,0,.55);border-radius:999px;padding:3px}
.sd .slk svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sd.addc{display:grid;place-items:center;border-style:dashed;color:var(--mut);font-size:28px;aspect-ratio:auto;width:84px;background:transparent}
#pbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;gap:6px;align-items:center;padding:5px 8px;border-radius:999px}
#app.play #pbar{display:flex}
#pcount{min-width:54px;text-align:center;font-weight:600;font-size:12px}
#app.play #tools,#app.play #hud,#app.play #auto,#app.play #set,#app.play #lockb,#app.play #toast{display:none!important}
#pexit{position:absolute;right:14px;top:14px;display:none;z-index:5}
#app.play #pexit{display:grid}
#app.play #vp{cursor:pointer}
.tm input[type=checkbox]{width:auto;margin:0}

#vp{background:#000}#stage{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
#ratw{grid-column:1/-1}#ratw select{width:100%;padding:7px 9px;border-radius:9px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:500 13px Inter,sans-serif}#ratw option{color:#000}
#tools,#hud,#auto,#lockb,#fab,#toast,#pbar{z-index:3}#set{z-index:6}
#fab{position:absolute;left:14px;bottom:14px;display:none}#app.pm #fab{display:block}#app.play #fab{display:none!important}
#fabl{position:absolute;left:0;bottom:48px;display:flex;flex-direction:column;gap:8px}
#fabl .rb{opacity:0;transform:translateY(10px) scale(.8);transition:opacity .2s,transform .2s;pointer-events:none}
#fab.open #fabl .rb{opacity:1;transform:none;pointer-events:auto}
#fabm svg{transition:transform .2s}#fab.open #fabm svg{transform:rotate(45deg)}
#tbl{position:absolute;inset:0;z-index:5;pointer-events:none}#app.play #tbl{overflow:hidden}
#tbA,#tbB{position:absolute;inset:0;pointer-events:none}
.tb{position:absolute;pointer-events:auto;box-sizing:border-box;cursor:move;touch-action:auto;display:flex;flex-direction:column;line-height:1.35;user-select:none;-webkit-user-select:none}
#app.play .tb{pointer-events:none}
.tt{flex:1 0 auto;touch-action:none;padding:.2em .3em;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;min-height:1.35em;outline:0}
.tb.sel{outline:1.5px solid var(--acc)}
.tb.ed{cursor:text;touch-action:auto;user-select:text;-webkit-user-select:text}
.tb .hd,.tb .tbt{display:none}
.tb.sel .hd{display:block}.tb.sel .tbt{display:flex}
.hd{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.35);touch-action:none}
.hd::after{content:"";position:absolute;inset:-10px}
.hd.nw{left:0;top:0;cursor:nwse-resize}.hd.n{left:50%;top:0;cursor:ns-resize}.hd.ne{left:100%;top:0;cursor:nesw-resize}.hd.e{left:100%;top:50%;cursor:ew-resize}
.hd.se{left:100%;top:100%;cursor:nwse-resize}.hd.s{left:50%;top:100%;cursor:ns-resize}.hd.sw{left:0;top:100%;cursor:nesw-resize}.hd.w{left:0;top:50%;cursor:ew-resize}
.tbt{position:absolute;left:50%;transform:translateX(-50%);gap:6px;align-items:center;padding:4px 6px;border-radius:999px;font-size:13px;white-space:nowrap;z-index:10}
.tbt input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.tbt .btn{padding:4px 8px;display:grid;place-items:center}
.cbtn{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer;flex:none}
.tbs{width:30px;height:28px;padding:0!important;font-size:14px}.tbs.act{background:var(--acc);color:#fff;border-color:var(--acc)}
.cpop{display:none;position:absolute;left:0;top:calc(100% + 8px);width:224px;padding:10px 12px;border-radius:14px;flex-direction:column;gap:9px;font-size:11px;color:var(--mut);background:var(--bg)}
.tb.cp .cpop{display:flex}.tb.pu .cpop{top:auto;bottom:calc(100% + 8px)}
.cr{display:grid;grid-template-columns:46px 1fr;align-items:center;gap:6px}
.cpop input[type=range]{height:10px;border-radius:6px;background:var(--g);margin:0}
.tb.ed .tt{touch-action:auto}
.fbtn{width:30px;height:28px;padding:0!important;font-size:13px;font-weight:600}.fbtn.act{background:var(--acc);color:#fff;border-color:var(--acc)}
.fpop{display:none;position:absolute;left:0;top:calc(100% + 8px);width:224px;padding:8px;border-radius:14px;flex-direction:column;gap:8px;background:var(--bg)}
.tb.fp .fpop{display:flex}.tb.pu .fpop{top:auto;bottom:calc(100% + 8px)}
.fl{display:flex;flex-direction:column;gap:2px;overflow:auto;max-height:190px;touch-action:pan-y}
.fi{border:0;background:transparent;color:var(--tx);text-align:left;padding:6px 8px;border-radius:8px;font-size:15px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.fi.act{background:var(--acc);color:#fff}.fup{flex:none}
#ratw{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}.dd{position:relative}
#set #ratb{display:flex;justify-content:space-between;align-items:center;width:100%;min-width:100%;padding:11px 16px;font-size:14px}
#ratw .dd{width:100%}
.ddl{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;padding:4px;border-radius:12px;flex-direction:column;background:var(--bg)}.dd.open .ddl{display:flex}
.spbtn{width:30px;height:28px;padding:0!important;display:grid;place-items:center}.spbtn.act{background:var(--acc);color:#fff;border-color:var(--acc)}
.spop{display:none;position:absolute;left:0;top:calc(100% + 8px);width:230px;padding:10px 12px;border-radius:14px;flex-direction:column;gap:9px;font-size:11px;color:var(--mut);background:var(--bg)}
.tb.sp .spop{display:flex}.tb.pu .spop{top:auto;bottom:calc(100% + 8px)}
.spop .cr{grid-template-columns:34px 1fr 36px}.spop input[type=range]{margin:0}.spop .cr span:last-child{text-align:right;color:var(--tx)}
.albtn{width:30px;height:28px;padding:0!important;display:grid;place-items:center}
.apop{display:none;position:absolute;left:0;top:calc(100% + 8px);width:132px;padding:6px;border-radius:14px;flex-direction:column;gap:2px;background:var(--bg)}
.tb.ap .apop{display:flex}.tb.pu .apop{top:auto;bottom:calc(100% + 8px)}.apop .fi{display:flex;align-items:center;gap:8px}
.rb.off{position:relative}.rb.off::after{content:"";position:absolute;left:50%;top:50%;width:28px;height:2px;margin:-1px 0 0 -14px;background:currentColor;border-radius:2px;transform:rotate(45deg);pointer-events:none}
.tb .rot{display:none}.tb.sel .rot{display:block}
/* 讓旋轉鈕預設層級為 2 */
.rot{
  position:absolute;
  left:50%;
  top:calc(-30px*var(--uz,1));
  width:calc(14px*var(--uz,1));
  height:calc(14px*var(--uz,1));
  margin-left:calc(-7px*var(--uz,1));
  border-radius:50%;
  background:#fff;
  border:2px solid var(--acc);
  cursor:grab;
  touch-action:none;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
  z-index: 2; /* 確保在旋轉線條之上 */
}
.rot::before{
  content:"";
  position:absolute;
  left:50%;
  top:100%;
  width:calc(1.5px*var(--uz,1));
  height:calc(16px*var(--uz,1));
  margin-left:calc(-.75px*var(--uz,1));
  background:var(--acc);
  z-index: 1;
}
.rot::after{content:"";position:absolute;inset:calc(-10px*var(--uz,1))}

/* 8 個邊框控制點：將 z-index 提高為 5，壓在旋轉軸手柄之上 */
.hd{
  position:absolute;
  width:calc(12px*var(--uz,1));
  height:calc(12px*var(--uz,1));
  margin:calc(-6px*var(--uz,1)) 0 0 calc(-6px*var(--uz,1));
  border-radius:50%;
  background:#fff;
  border:calc(2px*var(--uz,1)) solid var(--acc);
  box-shadow:0 1px 4px rgba(0,0,0,.35);
  touch-action:none;
  z-index: 5; /* 關鍵：確保控制點層級高於 .rot，能夠完美壓在旋轉手柄上 */
}
.hd::after{content:"";position:absolute;inset:calc(-10px*var(--uz,1))}

.rot{top:calc(-30px*var(--uz,1));width:calc(14px*var(--uz,1));height:calc(14px*var(--uz,1));margin-left:calc(-7px*var(--uz,1));border-width:calc(2px*var(--uz,1))}
.rot::before{width:calc(1.5px*var(--uz,1));height:calc(16px*var(--uz,1));margin-left:calc(-.75px*var(--uz,1))}
.rot::after{inset:calc(-10px*var(--uz,1))}
.tbt{top:calc(-80px*var(--uz,1))}.tb.low .tbt{top:auto;bottom:calc(-46px*var(--uz,1))}
.osl label{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:11px;margin-bottom:6px}.osl{display:flex;flex-direction:column}#dobj .grid{margin-top:4px}

/* 文字工具列 → dashboard */
#dtext{flex-direction:column;gap:10px}
#dtext .tbt{position:static;left:auto;top:auto!important;bottom:auto!important;transform:none!important;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0;border:0;border-radius:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;white-space:normal}
#dtext .cbtn{width:34px;height:34px}
#dtext .tbs,#dtext .fbtn,#dtext .spbtn,#dtext .albtn{width:40px;height:34px}
#dtext .tbt .btn.tbd{width:40px;height:34px}
#dtext .cpop,#dtext .fpop,#dtext .spop,#dtext .apop{position:static;display:none;flex:1 1 100%;width:100%;max-width:460px;left:auto;top:auto!important;bottom:auto!important}
#dtext.cp .cpop,#dtext.fp .fpop,#dtext.sp .spop,#dtext.ap .apop{display:flex}
#dtext .apop{max-width:180px}
#dtext .fl{max-height:140px}
#gll{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.gl{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
#tbG{position:absolute;inset:0;pointer-events:none}
#app.play #tbG,#app:not(.pm) #tbG{display:none}
.glh{position:absolute;pointer-events:auto;width:calc(22px*var(--uz,1));height:calc(22px*var(--uz,1));margin:calc(-11px*var(--uz,1)) 0 0 calc(-11px*var(--uz,1));border-radius:50%;background:#fff;border:calc(2px*var(--uz,1)) solid var(--acc);box-shadow:0 1px 6px rgba(0,0,0,.5);touch-action:none;cursor:move}
.glh::after{content:"";position:absolute;inset:calc(-12px*var(--uz,1))}
.glh.sel{background:var(--acc);border-color:#fff}

.tm{gap:8px;font-size:14px;white-space:nowrap;flex:none}
.tm .num{width:68px;font-size:16px;padding:6px 10px}
.tm input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}

#set{display:grid;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px) scale(.94);transform-origin:calc(100% - 20px) 100%;transition:opacity .2s ease,transform .3s cubic-bezier(.2,.9,.25,1.1),visibility 0s linear .3s}

/* 工具列開關按鈕動畫 */
.rb{position:relative;transition:color .22s,background .22s,box-shadow .22s,transform .18s cubic-bezier(.3,1.5,.5,1)}
.rb:active{transform:scale(.88)}
.rb.act{outline:0;background:color-mix(in srgb,var(--acc) 16%,var(--glass));box-shadow:0 0 0 2px var(--acc),var(--sh)}
.rb svg{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.rb.act svg{transform:scale(1.08)}
.rb::after,.rb.off::after{content:"";position:absolute;left:50%;top:50%;width:28px;height:2px;margin:-1px 0 0 -14px;background:currentColor;border-radius:2px;transform:rotate(45deg) scaleX(0);transition:transform .25s cubic-bezier(.3,1.2,.5,1);pointer-events:none}
.rb.off::after{transform:rotate(45deg) scaleX(1)}
input[type=range]{touch-action:pan-y}
#strip{position:relative}

.sd.drag{z-index:5;opacity:.93;box-shadow:0 10px 28px rgba(0,0,0,.5);transition:none;cursor:grabbing}

#smenu{position:fixed;z-index:30;display:flex;flex-direction:column;padding:6px;border-radius:14px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px) scale(.92);transform-origin:bottom right;transition:opacity .15s,transform .2s cubic-bezier(.2,.9,.25,1.1),visibility 0s linear .2s}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const COL=[0x2563eb,0x16a34a,0x9333ea,0xdb2777,0x0891b2,0xca8a04];
const S={lenses:[{x:100,f:80,D:40},{x:260,f:60,D:40}],sel:null,panMode:false,screen:380,beam:30,N:2,ang:0,n:1.52,disp:0,exp:1,rot:0,fres:4,hd:'hall',otype:'plate',ssz:36};
const CUBE={x:-85,s:110};
let FX=null;
const P={on:false,playing:false,applying:false,slides:[],cur:0,back:0,hold:3,trans:1.6};
const f1=v=>Math.round(v*100)/100;
const sorted=()=>[...S.lenses].sort((a,b)=>a.x-b.x);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

// ---------- optics ----------
function trace(y0, z0, keep) {
 const ls = sorted(); if (!ls.length) return null;
 let x = ls[0].x, y = y0, z = z0, uy = Math.tan(S.ang * Math.PI / 180), uz = 0;
 const xs = Math.min(x - 60, CUBE.x + CUBE.s / 2), P = keep ? [[xs, y - uy * (x - xs), z]] : null;
 
 for (let i = 0; i < ls.length; i++) {
  const l = ls[i];
  y += uy * (l.x - x); z += uz * (l.x - x); x = l.x; keep && P.push([x, y, z]);
  
  let r2 = y * y + z * z;
  const maxR = l.D / 2;
  
  // 【Adaptive 自適應調整】如果是第一片透鏡，且光線落在口徑外，自動把它收斂對齊到透鏡邊緣
  if (i === 0 && r2 > maxR * maxR) {
   const r = Math.sqrt(r2) || 1;
   y = (y / r) * (maxR * 0.98); // 稍微內縮一點避免浮點數誤差
   z = (z / r) * (maxR * 0.98);
   r2 = y * y + z * z;
  }
  
  if (r2 > maxR * maxR) return { P, blocked: true };
  uy -= y / l.f; uz -= z / l.f;
 }
 
 const o = { P, blocked: false, ys: null, zs: null };
 if (S.screen > x) { o.ys = y + uy * (S.screen - x); o.zs = z + uz * (S.screen - x); }
 const xe = Math.max(S.screen, x) + 30; keep && P.push([xe, y + uy * (xe - x), z + uz * (xe - x)]);
 return o;
}

function blurAng(fo, sp) {
  // 如果沒有資料，物理上預設可以給 0，或者給一個極小的物理像差底線
  return (fo && fo.efl && sp) ? Math.min(0.5, sp.r / fo.efl) : 0;
}

function blurMM(fo,sp){const ls=sorted();if(!ls.length)return 0;const face=CUBE.x+(S.otype==='cube'?CUBE.s/2:0);return blurAng(fo,sp)*Math.max(0,ls[0].x-face)}
function spot(){
 if(!S.lenses.length)return null;
 const c=trace(0,0,false),B=S.beam/2;let tot=0,pass=0,r=0;
 for(const f of[0,.5,1])for(let k=0;k<(f?12:1);k++){
  const a=k/12*2*Math.PI,t=trace(f*B*Math.cos(a),f*B*Math.sin(a),false);tot++;
  if(!t.blocked){pass++;if(t.ys!=null&&c.ys!=null)r=Math.max(r,Math.hypot(t.ys-c.ys,t.zs-c.zs))}
 }
 return{r:c.ys==null?50:r,q:pass/tot,chief:c};
}
function focus(){
 const ls=sorted();if(!ls.length)return null;

const objT=x=>CUBE.s*0.87/Math.max(20,x-CUBE.x);
const DISC=(()=>{const a=[],n=40;for(let i=0;i<n;i++){const r=Math.sqrt((i+.5)/n),th=i*2.399963;a.push([r*Math.cos(th),r*Math.sin(th)])}return a})();

 const qmin=clamp((parseFloat($('#qmin').value)||50)/100,.01,1),fitO=$('#fitobj').checked;
 const u0=Math.tan(S.ang*Math.PI/180),hb=S.beam/2;
 function ev(g){
  let y=1,u=0;const A=[];
  for(let i=0;i<n;i++){if(i)y+=u*g[i-1];A.push(y);u-=y/ls[i].f}
  if(u>-1e-9)return null;

  let tot=0;for(const v of g)tot+=v;
  const x1=S.screen-bfd-tot;if(x1<LO||x1<CUBE.x+CUBE.s/2+5)return null;const OT=objT(x1);
  let yc=0,uc=u0;const C=[];

// ---------- Bezier easing + playback ----------
function bez(x1,y1,x2,y2){
 const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
 const X=t=>((ax*t+bx)*t+cx)*t,Y=t=>((ay*t+by)*t+cy)*t,dX=t=>(3*ax*t+2*bx)*t+cx;
 return p=>{
  if(p<=0)return 0;if(p>=1)return 1;
  let t=p;
  for(let i=0;i<8;i++){const e=X(t)-p;if(Math.abs(e)<1e-6)return Y(t);const d=dX(t);if(Math.abs(d)<1e-6)break;t-=e/d}
  let lo=0,hi=1;t=p;
  for(let i=0;i<32;i++){const x=X(t);if(Math.abs(x-p)<1e-6)break;if(x<p)lo=t;else hi=t;t=(lo+hi)/2}
  return Y(t);
 };
}
const EASE=bez(.65,0,.35,1);
function mixCam(a,b,e){
 let da=b.az-a.az;da=Math.atan2(Math.sin(da),Math.cos(da));
 V.az=a.az+da*e;V.el=a.el+(b.el-a.el)*e;V.d=a.d*Math.pow(b.d/a.d,e);
 V.t.set(a.t[0]+(b.t[0]-a.t[0])*e,a.t[1]+(b.t[1]-a.t[1])*e,a.t[2]+(b.t[2]-a.t[2])*e);V.pan.set(0,0,0);
}
function mixSt(a,b,e){
 const o=JSON.parse(JSON.stringify(e<.5?a:b));
 NUMK.forEach(k=>o[k]=a[k]+(b[k]-a[k])*e);
 o.cubeX=a.cubeX+(b.cubeX-a.cubeX)*e;if(a.cubeS&&b.cubeS)o.cubeS=a.cubeS+(b.cubeS-a.cubeS)*e;
 if(a.lenses.length===b.lenses.length)o.lenses=a.lenses.map((l,i)=>({x:l.x+(b.lenses[i].x-l.x)*e,f:l.f+(b.lenses[i].f-l.f)*e,D:l.D+(b.lenses[i].D-l.D)*e,E:(l.E!=null?l.E:1.6)+((b.lenses[i].E!=null?b.lenses[i].E:1.6)-(l.E!=null?l.E:1.6))*e}));
 return o;
}

function pFrame(now){tbTick();if(P.playing&&(pb.phase==='out'||pb.phase==='in')){if((now-pb.t0)/1000>=TF){pb.phase=pb.phase==='out'?'move':'hold';pb.t0=now}pb.raf=requestAnimationFrame(pFrame);return}
 if(!P.playing)return;
 const n=P.slides.length;
 if(pb.phase==='hold'){
  if(P.slides[pb.from].auto&&(now-pb.t0)/1000>=(P.slides[pb.from].hold||3)){if(pb.from>=n-1){pStop();return}pb.to=pb.from+1;pb.phase=tbHas(pb.from)?'out':'move';pb.t0=now}
 }else{
    const p=Math.min(1,(now-pb.t0)/1000/P.trans),e=EASE(p),A=P.slides[pb.from],B=P.slides[pb.to];
  mixCam(A.cam, B.cam, e);
  const v = k => (A.st[k] ? 0 : 1) + ((B.st[k] ? 0 : 1) - (A.st[k] ? 0 : 1)) * e;
  
  // 關鍵修正：把轉場進度 e 傳給 rayProgress，讓 update() 的畫線動畫抓得到數值
  let rayProg = 1;
  if (A.st.noRays && !B.st.noRays) rayProg = e;        // 從頭畫到尾
  else if (!A.st.noRays && B.st.noRays) rayProg = 1 - e; // 從尾縮回頭
  else rayProg = 1;                                    // 一般轉場時同步生長

  FX = {
    lens: v('hideLens'),
    rays: v('noRays'),
    rayProgress: rayProg, // 傳遞畫線進度
    dims: (A.st.dims ? 1 : 0) + ((B.st.dims ? 1 : 0) - (A.st.dims ? 1 : 0)) * e
  };
  glDraw(glMix(A.gl||[],B.gl||[],e));applySt(mixSt(A.st, B.st, e));


  if(p>=1){FX=null;pb.from=pb.to;pb.phase=tbHas(pb.from)?'in':'hold';pb.t0=now;pCount()}
 }
 pb.raf=requestAnimationFrame(pFrame);
}

  const A=pr.auto||{};['gmin','lo','qmin'].forEach(k=>{if(A[k]!=null)$('#'+k).value=A[k]});if(A.fitobj!=null)$('#fitobj').checked=!!A.fitobj;
  if(pr.ptrans)$('#ptrans').value=pr.ptrans;if(pr.hudOn!=null){$('#hudon').checked=!!pr.hudOn;$('#hudon').onchange()}
  const rb=[...$('#ratl').querySelectorAll('.fi')].find(b=>b.dataset.v===pr.ratioV);if(rb)rb.click();
  P.slides=(pr.slides||[]).map(x=>({st:x.st,cam:x.cam,lock:!!x.lock,thumb:x.thumb||null,tb:x.tb||[],gl:x.gl||[],auto:!!x.auto,hold:x.hold||3}));
  P.cur=P.slides.length?clamp(pr.cur|0,0,P.slides.length-1):0;
  applySt(pr.S);capD();
  if(pr.pon&&P.slides.length)pToggle(true);
  else{if(pr.view)setCam(pr.view);update();render()}
  $('#set').classList.remove('on');
  uResetAll();toast().textContent='已導入專案。';
 }catch(e){toast().textContent='導入失敗：'+e.message}
}
$('#psave').onclick=projSave;
$('#pload').onclick=()=>$('#pfile').click();
$('#pfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)projLoad(f)};
// ---------- 復原 / 重做（只記錄被改動的參數） ----------
const Hm={u:[],r:[]};
const IDS=new WeakMap();let idn=0;const idOf=o=>{let i=IDS.get(o);if(!i){i=++idn;IDS.set(o,i)}return i};
const UGK=['screen','beam','N','ang','n','disp','exp','rot','fres','otype','ssz','dims','hideLens','noRays','glow'];
const ULF=['x','f','D','E'],UTF=['x','y','w','h','fs','c','text','b','i','ls','lh','al','r','ff'],UGF=['x','y','r','a','c0','c1'];
const UN={x:'位置',f:'焦距 f',D:'口徑',E:'邊緣厚度',screen:'屏幕位置',beam:'光束直徑',N:'每面光線數',ang:'入射角',n:'折射率',disp:'色散',exp:'HDRI 亮度',rot:'HDRI 旋轉',fres:'菲涅爾',otype:'物體類型',ssz:'屏幕尺寸',dims:'顯示間距',hideLens:'隱藏鏡片',noRays:'隱藏光線',glow:'發光'};
const UTN={x:'X',y:'Y',w:'寬度',h:'高度',fs:'字級',c:'顏色',text:'內容',b:'粗體',i:'斜體',ls:'字距',lh:'行距',al:'對齊',r:'旋轉',ff:'字體'};
const UGN={x:'X',y:'Y',r:'大小',a:'強度',c0:'中心顏色',c1:'外圍顏色'};
let uBase=null,uPrev=null,uPl=false;const uDown=new Set();
const uH=()=>{const s=P.on&&curSlide();return s?(s.h||(s.h={u:[],r:[]})):Hm};
function uCollect(){
 const v=new Map(),d=new Map(),lists={};
 const put=(k,val,ds)=>{v.set(k,val);d.set(k,ds)};
 UGK.forEach(f=>put('S:'+f,S[f],{t:'S',f}));
 put('C:x',CUBE.x,{t:'C',f:'x'});put('C:s',CUBE.s,{t:'C',f:'s'});
 v.set('LN',S.lenses.length);
 S.lenses.forEach((l,i)=>ULF.forEach(f=>put('L'+i+':'+f,l[f],{t:'L',i,f})));
 let slide=null;
 if(P.on){slide=curSlide()||null;if(slide){
  lists.TL=(slide.tb||[]).slice();lists.GL=(slide.gl||[]).slice();
  lists.TL.forEach(o=>UTF.forEach(f=>put('T'+idOf(o)+':'+f,o[f],{t:'T',o,f})));
  lists.GL.forEach(o=>UGF.forEach(f=>put('G'+idOf(o)+':'+f,o[f],{t:'G',o,f})));
 }}
 v.set('TL',(lists.TL||[]).map(idOf).join());v.set('GL',(lists.GL||[]).map(idOf).join());
 return{v,d,lists,slide,snap:{l:S.lenses.map(l=>({x:l.x,f:l.f,D:l.D,E:l.E})),ld:LD.map(c=>c?{...c}:c)}};
}
function uSame(a,b){if(a.v.size!==b.v.size)return false;for(const[k,x]of a.v){if(!b.v.has(k)||b.v.get(k)!==x)return false}return true}
function uDiff(a,b){
 const items=[],lc=a.v.get('LN')!==b.v.get('LN');
 b.v.forEach((val,k)=>{
  if(k==='LN'||k==='TL'||k==='GL'||!a.v.has(k))return;
  if(lc&&k[0]==='L')return;
  const o=a.v.get(k);if(o===val)return;
  items.push({...b.d.get(k),old:o,new:val});
 });
 if(lc)items.push({t:'LL',old:a.snap,new:b.snap});
 if(a.v.get('TL')!==b.v.get('TL'))items.push({t:'TL',old:a.lists.TL||[],new:b.lists.TL||[]});
 if(a.v.get('GL')!==b.v.get('GL'))items.push({t:'GL',old:a.lists.GL||[],new:b.lists.GL||[]});
 return items;
}
function uBtns(){const h=uH();$('#uundo').disabled=!h.u.length;$('#uredo').disabled=!h.r.length}
function uRebase(c){uBase=c||uCollect();uPrev=null;uBtns()}
function uCommit(cur){
 const items=uDiff(uBase,cur);
 if(items.length){const h=uH();h.u.push({items});if(h.u.length>300)h.u.shift();h.r.length=0}
 uRebase(cur);
}
function uFlushNow(){
 if(P.playing||uPl)return;
 const cur=uCollect();
 if(!uBase||cur.slide!==uBase.slide){uRebase(cur);return}
 if(!uSame(cur,uBase))uCommit(cur);
}
function uResetAll(){Hm.u.length=Hm.r.length=0;P.slides.forEach(s=>{delete s.h});uRebase()}
function uApply(items,useNew){
 let tb=false,lens=false;
 (useNew?items:items.slice().reverse()).forEach(it=>{
  const val=useNew?it.new:it.old;
  switch(it.t){
   case'S':S[it.f]=val;break;
   case'C':CUBE[it.f]=val;break;
   case'L':{const l=S.lenses[it.i];if(l)l[it.f]=val;break}
   case'LL':S.lenses=val.l.map(c=>({...c}));LD.length=0;val.ld.forEach(c=>LD.push(c?{...c}:c));lens=true;break;
   case'T':it.o[it.f]=val;if(it.f==='c')delete it.o.hsl;tb=true;break;
   case'G':it.o[it.f]=val;tb=true;break;
   case'TL':{const s=curSlide();if(s)s.tb=val.slice();tb=true;break}
   case'GL':{const s=curSlide();if(s)s.gl=val.slice();tb=true;break}
  }
 });
 if(lens){S.sel=null;buildMeshes()}
 syncUI();update();
 if(tb)tbRender();
}
function uName(it){
 switch(it.t){
  case'S':return UN[it.f]||it.f;
  case'C':return it.f==='x'?'物體位置':'物體大小';
  case'L':return'L'+(it.i+1)+' '+(UN[it.f]||it.f);
  case'LL':return'鏡片數量';
  case'T':return'文字方塊 '+(UTN[it.f]||it.f);
  case'G':return'Glow '+(UGN[it.f]||it.f);
  case'TL':return'文字方塊增減';
  case'GL':return'Glow 增減';
 }
 return'';
}
function uToast(pre,e){
 const nm=[...new Set(e.items.map(uName))],t=nm.slice(0,3).join('、')+(nm.length>3?'…':'');
 toast().textContent=pre+'：'+t;
}
function uUndo(){
 if(P.playing)return;uFlushNow();
 const h=uH(),e=h.u.pop();if(!e){uBtns();return}
 uApply(e.items,false);h.r.push(e);uRebase();uToast('復原',e);
}
function uRedo(){
 if(P.playing)return;uFlushNow();
 const h=uH(),e=h.r.pop();if(!e){uBtns();return}
 uApply(e.items,true);h.u.push(e);uRebase();uToast('重做',e);
}
$('#uundo').onclick=uUndo;$('#uredo').onclick=uRedo;
addEventListener('pointerdown',e=>uDown.add(e.pointerId),true);
['pointerup','pointercancel'].forEach(t=>addEventListener(t,e=>uDown.delete(e.pointerId),true));
addEventListener('blur',()=>uDown.clear());
setInterval(()=>{
 if(P.playing){uPl=true;return}
 const cur=uCollect();
 if(!uBase||cur.slide!==uBase.slide){uRebase(cur);return}
 if(uSame(cur,uBase)){uPrev=null;return}
 if(uDown.size){uPrev=null;return}
 if(uPrev&&uSame(cur,uPrev))uCommit(cur);else uPrev=cur;
},150);
{const _g=pGo;pGo=function(i){if(uPl)uPl=false;else uFlushNow();_g(i);uRebase()};
 const _t=pToggle;pToggle=function(on){uFlushNow();_t(on);uRebase()};
 const _p=pPlay;pPlay=function(){uFlushNow();_p();uPl=P.playing};$('#pplay').onclick=pPlay}
addEventListener('keydown',e=>{
 if(P.playing||!(e.ctrlKey||e.metaKey))return;
 const a=document.activeElement;
 if(a&&(a.isContentEditable||(/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='range'&&a.type!=='checkbox')))return;
 const k=e.key.toLowerCase();
 if(k==='z'){e.preventDefault();e.shiftKey?uRedo():uUndo()}else if(k==='y'){e.preventDefault();uRedo()}
});

$('#hudon').onchange=()=>{$('#hud').style.display=$('#hudon').checked?'':'none'};
build();resize();$('#auto').click();T.classList.remove('show');clearTimeout(tm);{const l0=sorted()[0];if(l0)CUBE.x=l0.x-70-(S.otype==='cube'?CUBE.s/2:0)}$('#fit').click();update();
</script>
