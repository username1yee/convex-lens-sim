<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 凸透鏡成像模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f7;--bg2:#dbe3f6;--glass:rgba(255,255,255,.74);--bd:rgba(20,30,70,.10);--tx:#0f172a;--mut:#64748b;--acc:#4f46e5;--acc2:#06b6d4;--track:rgba(15,23,42,.14);--dot:rgba(15,23,42,.10);--sh:0 10px 34px rgba(30,41,90,.14);--thumb:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070a12;--bg2:#141d38;--glass:rgba(20,26,44,.64);--bd:rgba(255,255,255,.09);--tx:#e8ecf6;--mut:#8a94ad;--acc:#7c8cff;--acc2:#22d3ee;--track:rgba(255,255,255,.16);--dot:rgba(255,255,255,.07);--sh:0 12px 44px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070a12;--bg2:#141d38;--glass:rgba(20,26,44,.64);--bd:rgba(255,255,255,.09);--tx:#e8ecf6;--mut:#8a94ad;--acc:#7c8cff;--acc2:#22d3ee;--track:rgba(255,255,255,.16);--dot:rgba(255,255,255,.07);--sh:0 12px 44px rgba(0,0,0,.55);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.45 Inter,system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}
#app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;grid-template-rows:1fr 0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
#app.open{grid-template-rows:3fr 1fr}
#vp{position:relative;min-height:0;overflow:hidden;background:radial-gradient(900px 500px at 15% -10%,var(--bg2),transparent 70%),radial-gradient(var(--dot) 1px,transparent 1px) 0 0/24px 24px,var(--bg)}
#vp canvas.m{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--sh)}
#pvbox{position:absolute;left:14px;top:14px;width:min(34%,190px);border-radius:16px;overflow:hidden;pointer-events:none;background:#0b0b10;border:1px solid var(--bd);box-shadow:var(--sh)}
#pvw{position:relative;width:100%;aspect-ratio:1;overflow:hidden}#pv{width:100%;height:100%;display:block;transform:scale(1.08);background:linear-gradient(#9db8e6,#e9f0fb)}#pvmsg{display:none;position:absolute;inset:0;place-items:center;color:#cfd5e6;font-size:12px}
#pvt{color:#cfd5e6;font-size:10px;padding:5px 8px;background:rgba(0,0,0,.55);letter-spacing:.02em}
#auto{position:absolute;right:14px;top:14px;border:0;border-radius:999px;padding:11px 18px;font:600 13px Inter,system-ui,sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .15s}
#auto:active{transform:scale(.96)}
#omenu{position:absolute;left:14px;top:14px;display:none;gap:4px;padding:5px;border-radius:999px}#omenu.on{display:flex}
#omenu button{border:0;background:transparent;color:var(--mut);padding:7px 12px;border-radius:999px;font:500 12px Inter,system-ui,sans-serif;cursor:pointer}
#omenu button.act{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
#toast{position:absolute;right:14px;top:62px;max-width:min(68%,340px);padding:10px 14px;border-radius:14px;font-size:12px;opacity:0;transform:translateY(-6px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#hud{position:absolute;left:14px;top:14px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 180px)}
.chip{padding:5px 11px;border-radius:999px;font-size:11px;color:var(--mut)}
.chip b{color:var(--tx);font-weight:600;margin-left:4px}.chip b.ok{color:#22c55e}.chip b.bad{color:#f43f5e}
#tools{position:absolute;right:14px;bottom:14px;display:flex;gap:8px}
.rb svg,.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb svg{width:20px;height:20px}.ic{width:18px;height:18px}
#auto{display:flex;align-items:center;gap:7px}.btn .ic{width:15px;height:15px;display:block}
.opts button{display:flex;flex-direction:column;align-items:center;gap:7px}.opts .ic{width:24px;height:24px}
.rb.act{outline:2px solid var(--acc);color:var(--acc)}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--tx);cursor:pointer;padding:0}
#set{position:absolute;right:14px;bottom:64px;width:min(330px,calc(100% - 28px));border-radius:18px;padding:14px;display:none;grid-template-columns:1fr 1fr;gap:10px;max-height:72%;overflow:auto}
#set.on{display:grid}
#set h4{grid-column:1/-1;margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#set label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}
#set .presets{grid-column:1/-1;display:flex;gap:6px}#set .presets .btn{grid-column:auto;border-radius:999px;flex:1}.btn.act{background:var(--acc);color:#fff;border-color:var(--acc)}
#set .gs{grid-column:1/-1}#set .gs label{flex-direction:row;justify-content:space-between}#set .gs b{color:var(--tx);font-weight:600}
#set input:not([type=range]):not([type=checkbox]){width:100%;padding:7px 9px;border-radius:9px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:500 13px Inter,sans-serif}
.btn{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:999px;padding:6px 12px;font:500 12px Inter,sans-serif;cursor:pointer}
.btn.danger{color:#f43f5e}
#set .btn{grid-column:1/-1;border-radius:10px}
#dash{min-height:0;overflow:hidden}
#dashin{height:100%;overflow:auto;padding:12px 18px;border-radius:22px 22px 0 0;border-bottom:0}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.dh strong{font-size:14px;font-weight:600}.sp{flex:1}
#dims{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dl{position:absolute;transform:translate(-50%,-50%);padding:3px 9px;border-radius:999px;font:600 11px Inter,system-ui,sans-serif;color:var(--tx);white-space:nowrap}
#dobj{display:none;flex-direction:column;gap:6px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opts button{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:14px;padding:14px 6px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.opts button.act{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.sl label{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:11px;margin-bottom:6px}
.num{width:64px;background:transparent;border:0;border-bottom:1px solid var(--bd);color:var(--tx);text-align:right;font:600 13px Inter,sans-serif;padding:0 2px}
.num:focus{outline:0;border-color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;margin:6px 0;outline:0;background:linear-gradient(90deg,var(--acc),var(--acc2)) 0/var(--p,50%) 100% no-repeat,var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--thumb);border:2px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--thumb);border:2px solid var(--acc)}

</style>
</head>
<body>
<div id="app">
<main id="vp">
 
 <div id="dims"></div>
 <button id="auto"><svg viewBox="0 0 24 24" aria-hidden="true" class="ic"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>自動調整</button>
 <div id="toast" class="glass"></div>
 <div id="hud">
  <div class="chip glass">EFL<b id="h_efl">—</b></div><div class="chip glass">焦點<b id="h_f">—</b></div>
  <div class="chip glass">模糊<b id="h_blur">—</b></div><div class="chip glass">通光<b id="h_q">—</b></div>
 </div>
 <div id="set" class="glass">
  <h4>玻璃材質（所有鏡片共用）</h4>
  <div class="gs"><label><span>折射率 IOR</span><b id="v_ior"></b></label><input type="range" id="ior" min="1.05" max="2.3" step="0.01"></div>
  <div class="gs"><label><span>色散</span><b id="v_disp"></b></label><input type="range" id="disp" min="0" max="0.12" step="0.002"></div>
  <div class="gs"><label><span>菲涅爾</span><b id="v_fres"></b></label><input type="range" id="fres" min="0" max="10" step="0.1"></div>
  <h4>HDRI 環境（僅用於反射）</h4>
  <div class="presets" id="hd"><button class="btn act" data-h="hall">科幻艙</button><button class="btn" id="hup">＋我的圖片</button></div><input type="file" id="hfile" accept="image/*" style="display:none">
  <div class="gs"><label><span>HDRI 亮度</span><b id="v_exp"></b></label><input type="range" id="exp" min="0.3" max="3" step="0.05"></div>
  <div class="gs"><label><span>HDRI 旋轉</span><b id="v_rot"></b></label><input type="range" id="rot" min="0" max="1" step="0.005"></div>
  
  
  <h4>全域設定</h4>
  <label>光束直徑 (mm)<input type="number" id="beam" value="30" min="1"></label>
  <label>每面光線數<input type="number" id="N" value="2" min="1" max="21"></label>
  <label>入射角 (°)<input type="number" id="ang" value="0" step="0.5"></label>
  
  <label>物體位置 (mm)<input type="number" id="cx" value="-85"></label>
  <label>屏幕位置 (mm)<input type="number" id="scr" value="380"></label>
  <label>屏幕尺寸 (mm)<input type="number" id="ssz" value="36" min="1"></label>
  <label>自動調整：最小間距<input type="number" id="gmin" value="5" min="0"></label>
  <label>自動調整：左邊界<input type="number" id="lo" value="0"></label>
  <label>最低通光量 (%)<input type="number" id="qmin" value="50" min="1" max="100"></label>
  <label style="flex-direction:row;align-items:center;gap:8px;grid-column:1/-1"><input type="checkbox" id="fitobj" style="width:auto">物體須完整落在屏幕內（取消則放大到極限）</label>
  <button class="btn" id="ssel">選取屏幕（顯示移動箭頭）</button>
  <button class="btn" id="af2">屏幕移到焦點</button>
 </div>
 <div id="tools">
  <button class="rb glass" id="add" title="新增鏡片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="rb glass" id="eye" title="自動移到從鏡片看過去的視角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="rb glass" id="hl" title="隱藏／顯示所有鏡片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-3.8 3-3.8 15 0 18 3.8-3 3.8-15 0-18z"/></svg></button>
  <button class="rb glass" id="rl" title="隱藏／顯示光線"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
  <button class="rb glass" id="dm" title="顯示鏡片間距與物體距離"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 8v8M21 8v8M7 9l-4 3 4 3M17 9l4 3-4 3"/></svg></button>
  
  <button class="rb glass" id="fit" title="重置視角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  
  <button class="rb glass" id="gear" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </div>
</main>
<section id="dash"><div id="dashin" class="glass">
 <div class="dh" id="dhl"><span class="dot" id="ddot"></span><strong id="dtitle">鏡片</strong><span class="sp"></span>
 <button class="btn" id="daf">對焦到屏幕</button><button class="btn danger" id="ddel">刪除</button><button class="btn" id="dclose" title="關閉"><svg viewBox="0 0 24 24" aria-hidden="true" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="grid" id="dgl">
  <div class="sl" data-k="x"><label><span>位置 x</span><span><input class="num" type="number" step="any"> mm</span></label><input type="range"></div>
  <div class="sl" data-k="f"><label><span>焦距 f</span><span><input class="num" type="number" step="any"> mm</span></label><input type="range"></div>
  <div class="sl" data-k="R"><label><span>曲率半徑 R</span><span><input class="num" type="number" step="any"> mm</span></label><input type="range"></div>
  <div class="sl" data-k="D"><label><span>口徑</span><span><input class="num" type="number" step="any"> mm</span></label><input type="range"></div>
 </div>
<div id="dobj"><div class="dh"><strong>觀察物體</strong><span class="sp"></span><button class="btn" id="dclose2" title="關閉"><svg viewBox="0 0 24 24" aria-hidden="true" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="opts"><button data-o="plate"><svg viewBox="0 0 24 24" aria-hidden="true" class="ic"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8.5 10a3.75 3.75 0 0 1 7.5 0v8.4"/><circle cx="12.5" cy="14.8" r="3.2"/></svg>a 方板</button><button data-o="chk"><svg viewBox="0 0 24 24" aria-hidden="true" class="ic"><rect x="4" y="4" width="16" height="16" rx="1"/><rect x="4" y="4" width="8" height="8" fill="currentColor"/><rect x="12" y="12" width="8" height="8" fill="currentColor"/></svg>棋盤格</button></div></div>
</div></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const COL=[0x2563eb,0x16a34a,0x9333ea,0xdb2777,0x0891b2,0xca8a04];
const S={lenses:[{x:100,f:80,D:40},{x:260,f:60,D:40}],sel:null,panMode:false,screen:380,beam:30,N:2,ang:0,n:1.52,disp:0,exp:1,rot:0,fres:4,hd:'hall',otype:'plate',ssz:36};
const CUBE={x:-85,s:110};
const f1=v=>Math.round(v*100)/100;
const sorted=()=>[...S.lenses].sort((a,b)=>a.x-b.x);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

// ---------- optics ----------
function trace(y0,z0,keep){
 const ls=sorted();if(!ls.length)return null;
 let x=ls[0].x,y=y0,z=z0,uy=Math.tan(S.ang*Math.PI/180),uz=0;
 const xs=Math.min(x-60,CUBE.x+CUBE.s/2),P=keep?[[xs,y-uy*(x-xs),z]]:null;
 for(const l of ls){
  y+=uy*(l.x-x);z+=uz*(l.x-x);x=l.x;keep&&P.push([x,y,z]);
  if(y*y+z*z>l.D*l.D/4)return{P,blocked:true};
  uy-=y/l.f;uz-=z/l.f;
 }
 const o={P,blocked:false,ys:null,zs:null};
 if(S.screen>x){o.ys=y+uy*(S.screen-x);o.zs=z+uz*(S.screen-x)}
 const xe=Math.max(S.screen,x)+30;keep&&P.push([xe,y+uy*(xe-x),z+uz*(xe-x)]);
 return o;
}
function spot(){
 if(!S.lenses.length)return null;
 const c=trace(0,0,false),B=S.beam/2;let tot=0,pass=0,r=0;
 for(const f of[0,.5,1])for(let k=0;k<(f?12:1);k++){
  const a=k/12*2*Math.PI,t=trace(f*B*Math.cos(a),f*B*Math.sin(a),false);tot++;
  if(!t.blocked){pass++;if(t.ys!=null&&c.ys!=null)r=Math.max(r,Math.hypot(t.ys-c.ys,t.zs-c.zs))}
 }
 return{r:c.ys==null?50:r,q:pass/tot,chief:c};
}
function focus(){
 const ls=sorted();if(!ls.length)return null;
 let y=1,u=0,x=ls[0].x;const imgs=[];
 for(const l of ls){y+=u*(l.x-x);x=l.x;u-=y/l.f;imgs.push(u<-1e-9?{real:true,x:x-y/u}:{real:false,x:u>1e-9?x-y/u:null})}
 return{imgs,last:imgs[imgs.length-1],lx:x,efl:u<-1e-9?-1/u:null};
}

// ---------- three.js ----------
const vp=$('#vp'),scene=new THREE.Scene();
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(devicePixelRatio||1);
R.domElement.className='m';vp.insertBefore(R.domElement,vp.firstChild);
const camera=new THREE.PerspectiveCamera(40,1,1,5000);
scene.add(new THREE.AmbientLight(0xffffff,.7));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(100,200,150);scene.add(dl);
const V={az:.6,el:.35,d:500,t:new THREE.Vector3(200,0,0),pan:new THREE.Vector3(),last:null,lock:false};
function cam(){camera.position.set(V.t.x+V.d*Math.cos(V.el)*Math.sin(V.az),V.t.y+V.d*Math.sin(V.el),V.t.z+V.d*Math.cos(V.el)*Math.cos(V.az));camera.lookAt(V.t)}
function selObj(){return typeof S.sel==='number'?S.lenses[S.sel]:S.sel==='screen'?{x:S.screen}:S.sel==='cube'?{x:CUBE.x}:null}
function goalT(){const o=selObj();return o?new THREE.Vector3(o.x,0,0).add(V.pan):V.t.clone()}
let raf=0;
function tick(){raf=0;if(V.lock)return;const g=goalT(),dv=g.clone().sub(V.t);if(dv.length()>.05){V.t.add(dv.multiplyScalar(.22));render();raf=requestAnimationFrame(tick)}else{V.t.copy(g);render()}}
function follow(){if(!raf)raf=requestAnimationFrame(tick)}
function panBy(dx,dy){
 const k=2*V.d*Math.tan(camera.fov*Math.PI/360)/(vp.clientHeight||400);
 const r=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),u=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
 const dv=r.multiplyScalar(-dx*k).add(u.multiplyScalar(dy*k));V.t.add(dv);V.pan.add(dv);
}
function render(){
 cam();sky.position.copy(camera.position);sky.visible=false;
 if(gizmo.visible){const dd=camera.position.distanceTo(gizmo.position);gizmo.scale.setScalar(dd*2*Math.tan(camera.fov*Math.PI/360)/(vp.clientHeight||430)*80/66)}
 R.render(scene,camera);placeDims();
}
function resize(){const w=vp.clientWidth,h=vp.clientHeight;R.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();render()}
new ResizeObserver(resize).observe(vp);

const axisL=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x8892a6}));scene.add(axisL);
const rayOK=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xff7a1a}));

 const Rr=2*(S.n-1)*l.f,a=Math.min(l.D/2,Rr*.95),E=1.6,s=Rr-Math.sqrt(Rr*Rr-a*a),T=s+E;
 return{Rr,a,T,cz:T-Rr};
}
function applyShape(m,l){
 const sh=shapeOf(l);
 m.geometry.dispose();const g=new THREE.CylinderGeometry(sh.a+.4,sh.a+.4,2*sh.T+.8,64,1);g.rotateX(Math.PI/2);m.geometry=g;
}
function glassU(fo,sp){
 const ls=S.lenses.slice(0,6);G.nf.value=ls.length;
 ls.forEach((l,i)=>{const sh=shapeOf(l);G.lens.value[i].set(l.x,sh.Rr,sh.cz,sh.a)});
 cube.updateMatrixWorld(true);G.cubeM.value.copy(cube.matrixWorld);G.cubeI.value.copy(cube.matrixWorld).invert();
 G.board.value.set(CUBE.x,CUBE.s,({cube:0,plate:1,chk:2})[S.otype],0);G.bg.value.set(getComputedStyle(document.body).backgroundColor);
 G.blur.value=fo&&fo.efl&&sp?Math.min(.5,sp.r/fo.efl):.15;
 G.bright.value=sp?.3+.7*sp.q:1;
}
function buildMeshes(){
 meshes.forEach(m=>{scene.remove(m);m.geometry.dispose();m.material.dispose()});meshes=[];
 S.lenses.forEach((l,i)=>{
  const mat=new THREE.ShaderMaterial({uniforms:{uLens:G.lens,uNf:G.nf,uIdx:{value:i},uSel:{value:0},uIor:G.ior,uDisp:G.disp,uFres:G.fres,uBlur:G.blur,uBright:G.bright,uCubeM:G.cubeM,uCubeI:G.cubeI,uCubeS:G.cubeS,uFaces:G.faces,uBoard:G.board,uBg:G.bg,uPlate:G.plate,uEnv:G.env,uExp:G.exp,uRot:G.rot},vertexShader:VERT,fragmentShader:FRAG,side:THREE.DoubleSide});
  const m=new THREE.Mesh(new THREE.BufferGeometry(),mat);m.rotation.y=Math.PI/2;m.userData={id:i,key:l.f+'|'+l.D+'|'+S.n};
  applyShape(m,l);scene.add(m);meshes.push(m);
 });
}
function setLines(o,a){o.geometry.dispose();const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));o.geometry=g}
const curX=()=>S.sel==='cube'?CUBE.x:S.sel==='screen'?S.screen:(S.lenses[S.sel]||{}).x;
function setX(x){if(S.sel==='cube')CUBE.x=x;else if(S.sel==='screen')S.screen=x;else if(S.lenses[S.sel])S.lenses[S.sel].x=x;sync();update()}

function update(){
 S.lenses.forEach((l,i)=>{
  const m=meshes[i];if(!m)return;const key=l.f+'|'+l.D+'|'+S.n;
  if(m.userData.key!=key){applyShape(m,l);m.userData.key=key}
  m.position.x=l.x;m.material.uniforms.uSel.value=i===S.sel?1:0;
 });
 G.ior.value=S.n;G.disp.value=S.disp;G.exp.value=S.exp;G.rot.value=S.rot;G.fres.value=S.fres;meshes.forEach(m=>m.visible=!S.hideLens);rayOK.visible=rayBk.visible=axisL.visible=scrMark.visible=!S.noRays;cube.visible=S.otype==='cube';plate.visible=S.otype==='plate';chkObj.visible=S.otype==='chk';[plate,chkObj].forEach(m=>{m.position.x=CUBE.x;m.scale.set(CUBE.s,CUBE.s,1);m.material.uniforms.uTint.value.setHex(S.sel==='cube'?0xfff0b8:0xffffff)});cube.position.x=CUBE.x;cube.children[1].material.color.setHex(S.sel==='cube'?0xffc400:0x101828);scr.position.x=S.screen;setLines(scrMark,[S.screen,-8,0,S.screen,8,0,S.screen,0,-8,S.screen,0,8]);scrMark.material.color.setHex(S.sel==='screen'?0xffc400:0x8892a6);
 const N=Math.max(1,S.N),B=S.beam/2,ok=[],bk=[];
 for(const ph of[0,Math.PI/4,Math.PI/2,3*Math.PI/4])for(let i=0;i<N;i++){
  const r=N==1?0:-B+2*B*i/(N-1),t=trace(r*Math.cos(ph),r*Math.sin(ph),true);if(!t)continue;
  const a=t.blocked?bk:ok;for(let k=1;k<t.P.length;k++)a.push(...t.P[k-1],...t.P[k]);
 }
 setLines(rayOK,ok);setLines(rayBk,bk);
 const xs=[...S.lenses.map(l=>l.x),S.screen,CUBE.x];setLines(axisL,[Math.min(...xs)-80,0,0,Math.max(...xs)+80,0,0]);
 const cx=curX();
 if(cx!=null){const rad=S.sel==='cube'?CUBE.s*.87:S.sel==='screen'?S.ssz/2:S.lenses[S.sel].D/2;gizmo.visible=true;gizmo.position.set(cx,-(rad+16),0)}else gizmo.visible=false;
 if(S.sel!==V.last){V.last=S.sel;if(S.sel!=null)V.pan.set(0,0,0)}follow();dash();const fo=focus(),sp=spot();info(fo,sp);glassU(fo,sp);updDims();render();
}

function info(fo,sp){
 const g=(id,s,c)=>{const e=$('#'+id);e.textContent=s;e.className=c||''};
 if(!fo){g('h_efl','—');g('h_f','—');g('h_blur','—');g('h_q','—');return}
 g('h_efl',fo.efl!=null?f1(fo.efl)+' mm':'—');
 g('h_f',fo.last.real?f1(fo.last.x)+' mm':'發散');
 if(sp){g('h_blur',sp.r.toFixed(3)+' mm',sp.r<.05?'ok':'bad');g('h_q',Math.round(sp.q*100)+'%',sp.q>.99?'ok':'bad')}
}

// ---------- controls ----------
const rc=new THREE.Raycaster(),dom=R.domElement,pt=new Map();let dr=null,pinch=null;
function ndc(e){const r=dom.getBoundingClientRect();return new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1)}
function pick(e,o){rc.setFromCamera(ndc(e),camera);return rc.intersectObjects(o,true)[0]}
function lineS(e){
 rc.setFromCamera(ndc(e),camera);const O=rc.ray.origin,D=rc.ray.direction,w=new THREE.Vector3(-O.x,gizmo.position.y-O.y,-O.z);
 return(D.x*D.dot(w)-w.x)/(1-D.x*D.x);
}
dom.addEventListener('pointerdown',e=>{cancelAnimationFrame(anim);
 dom.setPointerCapture(e.pointerId);pt.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});
 if(pt.size==2){const[a,b]=[...pt.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,V:V.d,m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};dr=null;return}
 if(gizmo.visible&&pick(e,[gizmo])){dr={t:'g',off:lineS(e)-curX()};V.lock=true;return}
 dr={t:(e.button===2||e.button===1||e.shiftKey||S.panMode)?'p':'o'};
});
dom.addEventListener('pointermove',e=>{
 const p=pt.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(pinch&&pt.size==2){const[a,b]=[...pt.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;V.d=clamp(pinch.V*pinch.d/(Math.hypot(a.x-b.x,a.y-b.y)||1),30,4000);panBy(mx-pinch.m.x,my-pinch.m.y);pinch.m={x:mx,y:my};render()}
 else if(dr&&dr.t=='g')setX(Math.round((lineS(e)-dr.off)*10)/10);
 else if(dr&&dr.t=='o'){V.az-=dx*.008;V.el=clamp(V.el+dy*.008,-1.4,1.4);render()}
 else if(dr&&dr.t=='p'){panBy(dx,dy);render()}
});
function end(e){
 const o=pt.get(e.pointerId),moved=o&&Math.hypot(e.clientX-o.x0,e.clientY-o.y0)>5;
 pt.delete(e.pointerId);if(pt.size<2)pinch=null;
 if(e.type=='pointerup'&&!moved&&dr&&dr.t=='o'){
  rc.setFromCamera(ndc(e),camera);const hs=rc.intersectObjects([...meshes.filter(m=>m.visible),scr,...[cube,plate,chkObj].filter(o=>o.visible)],true);let id=null;
  for(const h of hs){let ob=h.object;while(ob.parent&&ob.userData.id===undefined)ob=ob.parent;const k=ob.userData.id;if(k===undefined)continue;
   id=k;break}
  S.sel=id;update();
 }
 dr=null;V.lock=false;follow();
}
dom.addEventListener('contextmenu',e=>e.preventDefault());
dom.addEventListener('pointerup',end);dom.addEventListener('pointercancel',end);
dom.addEventListener('wheel',e=>{e.preventDefault();V.d=clamp(V.d*(e.deltaY<0?.9:1.1),30,4000);render()},{passive:false});

$('#fit').onclick=()=>{const xs=[...S.lenses.map(l=>l.x),S.screen,CUBE.x],a=Math.min(...xs),b=Math.max(...xs),c=new THREE.Vector3((a+b)/2,0,0),o=selObj();if(o)V.pan.copy(c).sub(new THREE.Vector3(o.x,0,0));else V.t.copy(c);V.d=Math.max(150,(b-a)*1.2+120);V.az=.6;V.el=.35;follow();render()};

// ---------- UI ----------
function markSel(){}
const app=$('#app'),T=$('#toast');let tm;
function toast(){T.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>T.classList.remove('show'),6500);return T}
const LIM={f:[10,300,.5],R:[10,600,1],D:[5,120,1]};
const hex=c=>'#'+c.toString(16).padStart(6,'0');
const curLens=()=>typeof S.sel==='number'?S.lenses[S.sel]:null;
function sync(){
 if(document.activeElement!==$('#scr'))$('#scr').value=f1(S.screen);
 if(document.activeElement!==$('#cx'))$('#cx').value=f1(CUBE.x);
 const l=curLens();if(!l)return;
 document.querySelectorAll('.sl').forEach(d=>{
  const k=d.dataset.k,v=k=='R'?2*(S.n-1)*l.f:l[k],num=d.querySelector('.num'),rg=d.querySelector('input[type=range]');
  if(k=='x'){rg.min=Math.min(-100,Math.floor(v/50)*50-50);rg.max=Math.max(1000,S.screen+200,Math.ceil(v/50)*50+50);rg.step=.5}
  else{rg.min=LIM[k][0];rg.max=Math.max(LIM[k][1],Math.ceil(v));rg.step=LIM[k][2]}
  if(document.activeElement!==num)num.value=f1(v);
  rg.value=v;rg.style.setProperty('--p',((v-rg.min)/(rg.max-rg.min)*100)+'%');
 });
}
function dash(){
 const isObj=S.sel==='cube',isL=!!curLens();$('#dhl').style.display=isL?'':'none';$('#dgl').style.display=isL?'':'none';$('#dobj').style.display=isObj?'flex':'none';document.querySelectorAll('.opts button').forEach(b=>b.classList.toggle('act',b.dataset.o===S.otype));
 const l=curLens();app.classList.toggle('open',!!l||isObj);
 if(l){$('#dtitle').textContent='鏡片 L'+(S.sel+1);const c=hex(COL[S.sel%6]);$('#ddot').style.background=c;$('#ddot').style.color=c}
 sync();
}
function setK(k,v){
 const l=curLens();if(!l||!isFinite(v))return;
 if(k=='R'){if(v>0)l.f=v/(2*(S.n-1))}else if(k=='f'){if(v>0)l.f=v}else if(k=='D'){if(v>0)l.D=v}else l.x=v;
 update();
}
document.querySelectorAll('.sl').forEach(d=>{const k=d.dataset.k;d.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>setK(k,parseFloat(i.value))))});
function build(){buildMeshes()}
$('#ddel').onclick=()=>{if(curLens()){S.lenses.splice(S.sel,1);S.sel=null;buildMeshes();update()}};
$('#dclose').onclick=()=>{S.sel=null;update()};
$('#add').onclick=()=>{if(S.lenses.length>=6){toast().textContent='最多 6 片鏡片。';return}const last=S.lenses.reduce((m,l)=>Math.max(m,l.x),0);S.lenses.push({x:last+100,f:60,D:40});S.sel=S.lenses.length-1;buildMeshes();update()};
function bindG(id,k,vid,dg){
 const e=$('#'+id),paint=()=>{$('#'+vid).textContent=S[k].toFixed(dg);e.style.setProperty('--p',((e.value-e.min)/(e.max-e.min)*100)+'%')};
 e.value=S[k];paint();e.addEventListener('input',()=>{S[k]=parseFloat(e.value);paint();update()});
}
bindG('ior','n','v_ior',2);bindG('disp','disp','v_disp',3);bindG('fres','fres','v_fres',2);bindG('exp','exp','v_exp',2);bindG('rot','rot','v_rot',3);
document.querySelectorAll('#hd .btn').forEach(b=>b.onclick=()=>{S.hd=b.dataset.h;G.env.value=HD[S.hd];document.querySelectorAll('#hd .btn').forEach(x=>x.classList.toggle('act',x===b));update()});

document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{S.otype=b.dataset.o;update()});
$('#dclose2').onclick=()=>{S.sel=null;update()};
$('#ssel').onclick=()=>{S.sel='screen';update()};
$('#hup').onclick=()=>$('#hfile').click();
$('#hfile').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{
  const x=new THREE.Texture(im);x.minFilter=x.magFilter=THREE.LinearFilter;x.generateMipmaps=false;x.wrapS=THREE.RepeatWrapping;x.needsUpdate=true;
  HD.custom=x;S.hd='custom';G.env.value=x;document.querySelectorAll('#hd .btn').forEach(b=>b.classList.toggle('act',b.id=='hup'));update();
 };im.src=fr.result};
 fr.readAsDataURL(f);e.target.value='';
};
$('#cx').addEventListener('input',e=>{const v=parseFloat(e.target.value);if(isFinite(v)){CUBE.x=v;update()}});
let anim=0;
$('#rl').onclick=()=>{S.noRays=!S.noRays;$('#rl').classList.toggle('act',S.noRays);update()};
$('#dm').onclick=()=>{S.dims=!S.dims;$('#dm').classList.toggle('act',S.dims);update()};
$('#hl').onclick=()=>{S.hideLens=!S.hideLens;$('#hl').classList.toggle('act',S.hideLens);update()};
$('#eye').onclick=()=>{
 const ls=sorted();if(!ls.length)return;
 const l=typeof S.sel==='number'?S.lenses[S.sel]:ls[ls.length-1];
 S.sel=null;V.pan.set(0,0,0);
 V.az=Math.PI/2;V.el=0;V.t.set(l.x,0,0);
 V.d=Math.max(30,(l.D/2)/Math.tan(camera.fov*Math.PI/360)/.62);
 update();
};

$('#gear').onclick=()=>$('#set').classList.toggle('on');
for(const[id,k]of[['beam','beam'],['N','N'],['ang','ang'],['scr','screen'],['ssz','ssz']])
 $('#'+id).addEventListener('input',e=>{const v=parseFloat(e.target.value);if(!isFinite(v))return;if((k=='n'&&v<=1)||((k=='beam'||k=='ssz')&&v<=0))return;S[k]=k=='N'?clamp(Math.round(v),1,21):v;update()});
$('#af2').onclick=()=>{const fo=focus();if(fo&&fo.last.real){S.screen=fo.last.x;update()}};
$('#daf').onclick=()=>{
 const l=curLens();if(!l)return;const x0=l.x;let best=x0,bs=1e9;
 for(let x=x0-400;x<=x0+400;x+=.1){l.x=x;const fo=focus();if(fo.last.real){const s=Math.abs(fo.last.x-S.screen)+1e-4*Math.abs(x-x0);if(s<bs){bs=s;best=x}}}
 l.x=Math.round(best*10)/10;update();
};

// ---------- auto adjust (microscope: biggest + sharpest object) ----------
const objT=x=>CUBE.s*0.87/Math.max(20,x-CUBE.x);
const DISC=(()=>{const a=[],n=40;for(let i=0;i<n;i++){const r=Math.sqrt((i+.5)/n),th=i*2.399963;a.push([r*Math.cos(th),r*Math.sin(th)])}return a})();
$('#auto').onclick=()=>{
 const st=toast(),ls=sorted(),n=ls.length;
 if(!n){st.textContent='請先新增鏡片。';return}
 const gmin=Math.max(0,parseFloat($('#gmin').value)||0),lo=parseFloat($('#lo').value),LO=isFinite(lo)?lo:0;
 const qmin=clamp((parseFloat($('#qmin').value)||50)/100,.01,1),fitO=$('#fitobj').checked;
 const u0=Math.tan(S.ang*Math.PI/180),hb=S.beam/2;
 function ev(g){
  let y=1,u=0;const A=[];
  for(let i=0;i<n;i++){if(i)y+=u*g[i-1];A.push(y);u-=y/ls[i].f}
  if(u>-1e-9)return null;
  const bfd=-y/u;if(bfd<Math.max(gmin,1e-6))return null;
  let tot=0;for(const v of g)tot+=v;
  const x1=S.screen-bfd-tot;if(x1<LO||x1<CUBE.x+CUBE.s/2+5)return null;const OT=objT(x1);
  let yc=0,uc=u0;const C=[];
  for(let i=0;i<n;i++){if(i)yc+=uc*g[i-1];C.push(yc);uc-=yc/ls[i].f}
  const ycs=yc+uc*bfd,efl=-1/u;
  if(Math.abs(ycs)>S.ssz/2)return null;
  let pass=0;
  for(const[dy,dz]of DISC){let ok=true;for(let i=0;i<n;i++){const py=A[i]*dy*hb+C[i],pz=A[i]*dz*hb;if(py*py+pz*pz>ls[i].D*ls[i].D/4){ok=false;break}}if(ok)pass++}
  const q=pass/DISC.length;if(q<qmin)return null;
  let M=efl;
  if(fitO){const cap=(S.ssz/2-Math.abs(ycs))/OT;if(cap<=0)return null;M=efl<=cap?efl:Math.max(0,2*cap-efl)}
  return{efl,x1,g,q,score:M*(1+.05*q)};
 }
 const d=n-1,span=Math.max(S.screen-LO,10);let cands=[];const M=d==0?1:Math.min(120000,30000*d);
 for(let k=0;k<M;k++){const g=[];for(let i=0;i<d;i++)g.push(gmin+Math.random()*span);const r=ev(g);if(r)cands.push(r)}
 if(!cands.length){st.innerHTML='<span class="bad">找不到可行解</span>：請調低最低通光量、放寬左邊界／最小間距、加大口徑或屏幕尺寸，或取消「物體須完整落在屏幕內」。';return}
 cands.sort((a,b)=>b.score-a.score);cands=cands.slice(0,10);let best=cands[0];
 for(let c of cands){
  let step=span/20;
  for(let it=0;it<800&&step>1e-4;it++){
   let imp=false;
   for(let i=0;i<d;i++)for(const s of[-step,step]){const g=c.g.slice();g[i]=Math.max(gmin,g[i]+s);const r=ev(g);if(r&&r.score>c.score){c=r;imp=true}}
   for(let k=0;k<6&&d>1;k++){const g=c.g.map(v=>Math.max(gmin,v+(Math.random()*2-1)*step)),r=ev(g);if(r&&r.score>c.score){c=r;imp=true}}
   if(!imp)step/=2;
  }
  if(c.score>best.score)best=c;
 }
 let x=best.x1;ls[0].x=Math.round(x*100)/100;
 for(let i=1;i<n;i++){x+=best.g[i-1];ls[i].x=Math.round(x*100)/100}
 update();const sp=spot(),fill=Math.min(999,Math.round(best.efl*objT(best.x1)/(S.ssz/2)*100));
 st.innerHTML='<span class="ok">完成</span>：物體約佔屏幕 '+fill+'%，EFL ≈ '+f1(best.efl)+' mm，模糊半徑 '+(sp?sp.r.toFixed(3):'-')+' mm，通光量 '+(sp?Math.round(sp.q*100):'-')+'%。';
};

build();resize();$('#auto').click();T.classList.remove('show');clearTimeout(tm);{const l0=sorted()[0];if(l0)CUBE.x=l0.x-70-(S.otype==='cube'?CUBE.s/2:0)}$('#fit').click();update();
</script>
